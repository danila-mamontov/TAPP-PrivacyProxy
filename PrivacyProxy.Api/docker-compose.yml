services:
  privacyproxy:
    image: ghcr.io/plueschtierbaum/privacyproxy:latest
    ports:
      - "${BIND_HOST:-127.0.0.1}:8080:8080"
    environment:
      ASPNETCORE_HTTP_PORTS: "${APP_PORT:-8080}"
      # LLM
      Llm__BaseUrl: "${LLM_BASE_URL:-http://ollama:11434/v1/}"
      Llm__ApiKey: "${LLM_API_KEY}"
      Llm__Model: "${LLM_MODEL:-llama3}"
      # Presidio (reached via the shared "privacyproxy-net" network)
      Presidio__AnalyzerUrl: "${PRESIDIO_URL:-http://presidio-analyzer:3000}"
      # Mapping
      Mapping__TtlMinutes: "${MAPPING_TTL:-30}"
    networks:
      - privacyproxy-net

networks:
  privacyproxy-net:
    external: true
