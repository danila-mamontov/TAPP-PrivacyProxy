name: CI (.net)
on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test + Coverage
        run: dotnet test --no-build --filter "Category!=Integration" --collect:"XPlat Code Coverage" --results-directory ./coverage -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Exclude="[*]Microsoft.*,[*]System.*,[*]Program"
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ./coverage

  report:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage
      - name: Install report generator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool
      - name: Generate report
        run: reportgenerator -reports:"**/coverage.cobertura.xml" -targetdir:"./report" -reporttypes:"MarkdownSummaryGithub"
      - name: Write to Job Summary
        run: cat ./report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main  -> :latest, :stable, :<sha>  (current production image)
      # dev   -> :dev, :<sha>              (current development image)
      - name: Determine image tags
        id: meta
        env:
          IMAGE: ghcr.io/plueschtierbaum/privacyproxy
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            TAGS="$IMAGE:latest
          $IMAGE:stable
          $IMAGE:${{ github.sha }}"
          else
            TAGS="$IMAGE:dev
          $IMAGE:${{ github.sha }}"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: PrivacyProxy.Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
