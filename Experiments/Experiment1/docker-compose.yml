# Stack for Experiment 1: Presidio + Mock-LLM + PrivacyProxy.
# Intentionally does NOT depend on the external "privacyproxy-net" network --
# this compose file is fully self-contained, "docker compose up" is enough.
#
# The Presidio config is NOT duplicated: the build context points directly at
# the canonical ../../Presidio folder, AND the three YAML files are additionally
# mounted read-only so you can edit them for iterative tuning without rebuilding
# the image every time (only "docker compose restart presidio-analyzer" needed).

networks:
  experiment-net:
    driver: bridge

services:
  presidio-analyzer:
    build:
      context: ../../Presidio
      dockerfile: Dockerfile
    networks:
      - experiment-net
    ports:
      - "${PRESIDIO_PORT:-5002}:3000"
    volumes:
      - ../../Presidio/default.yaml:/app/presidio_analyzer/conf/default.yaml:ro
      - ../../Presidio/default_analyzer.yaml:/app/presidio_analyzer/conf/default_analyzer.yaml:ro
      - ../../Presidio/default_recognizers.yaml:/app/presidio_analyzer/conf/default_recognizers.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s  # the spaCy models take a moment before the server is up

  mock-llm:
    build:
      context: .
      dockerfile: Dockerfile.mock-llm
    networks:
      - experiment-net
    ports:
      - "${MOCK_LLM_PORT:-5005}:5005"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5005/health')"]
      interval: 3s
      timeout: 2s
      retries: 10

  privacyproxy:
    image: ghcr.io/plueschtierbaum/privacyproxy:${PRIVACYPROXY_IMAGE_TAG}
    networks:
      - experiment-net
    ports:
      - "${PROXY_PORT:-8090}:6000"
    # .env.presidio is generated by generate_presidio_env.py from
    # presidio_config.json (see run.sh) -- it is the only file you edit between
    # experiment iterations to tune entity types / thresholds.
    env_file:
      - .env.presidio
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:6000           # http only inside the container, no https dev-cert hassle
      Llm__BaseUrl: http://mock-llm:5005/v1/    # trailing slash is required!
      Llm__ApiKey: mock
      Llm__Model: mock
      Presidio__AnalyzerUrl: http://presidio-analyzer:3000
    depends_on:
      presidio-analyzer:
        condition: service_healthy
      mock-llm:
        condition: service_healthy
    healthcheck:
      # Best-effort TCP check. PrivacyProxy.Api exposes a "/health" endpoint, so
      # switching to "curl -f http://localhost:6000/health" would be a more
      # reliable readiness check than a plain port check (curl is not guaranteed
      # to be present in the image, hence the TCP probe here).
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6000' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s