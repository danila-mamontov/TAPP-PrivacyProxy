supported_languages:
  - en
  - de
global_regex_flags: 26

recognizers:
  - name: CreditCardRecognizer
    supported_languages:
      - language: en
        context: [credit, card, visa, mastercard, cc, amex, discover, jcb, diners, maestro, instapayment]
      - language: es
        context: [tarjeta, credito, visa, mastercard, cc, amex, discover, jcb, diners, maestro, instapayment]
      - language: it
      - language: pl
    type: predefined

  - name: UsBankRecognizer
    supported_languages:
      - en
    type: predefined

  - name: UsLicenseRecognizer
    supported_languages:
      - en
    type: predefined

  - name: UsItinRecognizer
    supported_languages:
      - en
    type: predefined

  - name: UsPassportRecognizer
    supported_languages:
      - en
    type: predefined

  - name: UsSsnRecognizer
    supported_languages:
      - en
    type: predefined

  - name: NhsRecognizer
    supported_languages:
      - en
    type: predefined

  - name: EsNifRecognizer
    supported_languages:
      - es
    type: predefined

  - name: EsNieRecognizer
    supported_languages:
      - es
    type: predefined

  - name: ItDriverLicenseRecognizer
    supported_languages:
      - it
    type: predefined

  - name: ItFiscalCodeRecognizer
    supported_languages:
      - it
    type: predefined

  - name: ItVatCodeRecognizer
    supported_languages:
      - it
    type: predefined

  - name: ItIdentityCardRecognizer
    supported_languages:
      - it
    type: predefined

  - name: ItPassportRecognizer
    supported_languages:
      - it
    type: predefined

  - name: PlPeselRecognizer
    supported_languages:
      - pl
    type: predefined

  - name: CryptoRecognizer
    type: predefined

  - name: DateRecognizer
    type: predefined

  - name: EmailRecognizer
    type: predefined

  - name: IbanRecognizer
    type: predefined

  - name: IpRecognizer
    type: predefined

  - name: MedicalLicenseRecognizer
    type: predefined

  - name: MacAddressRecognizer
    type: predefined

  - name: PhoneRecognizer
    type: predefined

  - name: UrlRecognizer
    type: predefined

  # NOTE: the previously present custom German Date/Time/Money recognizers
  # (GermanDateRecognizer, GermanTimeRecognizer, GermanMoneyRecognizer) have
  # been DELIBERATELY REMOVED here to keep this configuration 100% Presidio
  # defaults, consistent with the thesis's scope decision: only the NLP
  # backend (transformers) is swapped in, no custom recognizers, no threshold
  # tuning. See Thesis Section "Scope and Delimitation".